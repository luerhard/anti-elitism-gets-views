stages:
  run_asr:
    cmd: python pipeline/02-run_asr.py
    deps:
    - data/raw/yt/@AfDFraktionimBundestag
    - data/raw/yt/@AfDTV
    - data/raw/yt/@DIELINKE
    - data/raw/yt/@DieGruenen
    - data/raw/yt/@FDP
    - data/raw/yt/@cdutv
    - data/raw/yt/@csumedia
    - data/raw/yt/@spdde
    - pipeline/02-run_asr.py
    - src/processing/whisper_pipeline.py
    - data/yt_metadata/videos.parquet
    outs:
    - data/interim/transcripts/v3_large_turbo.parquet:
        persist: true
  tokenize_transcripts:
    cmd: python pipeline/03-tokenize_transcripts.py
    deps:
    - pipeline/03-tokenize_transcripts.py
    - src/processing/transcript_cleaner.py
    - data/interim/transcripts/v3_large_turbo.parquet
    outs:
    - data/yt_metadata/sentences.parquet:
        persist: true
    - data/yt_metadata/broken_transcripts.parquet:
        persist: true
  run_popbert:
    cmd: python pipeline/04-run_popbert.py
    deps:
    - pipeline/04-run_popbert.py
    - src/processing/popbert_predictor.py
    - data/yt_metadata/sentences.parquet
    outs:
    - data/yt_metadata/popbert.parquet:
        persist: true
  basic_descriptives:
    cmd: papermill pipeline/05-basic_descriptives.ipynb reports/notebooks/05-basic_descriptives.ipynb
    deps:
    - src/load/
    - data/yt_metadata/
    - pipeline/05-basic_descriptives.ipynb
    outs:
    - reports/notebooks/05-basic_descriptives.ipynb
    - reports/tables/dataset_summary.csv
    - reports/figures/view_count.svg
    - reports/figures/populism_per_party.svg
    - reports/manuscript/inlines/n_broken.txt
    - reports/manuscript/inlines/n_sents.txt
    - reports/manuscript/inlines/n_videos.txt
    - reports/manuscript/inlines/sum_duration.txt
  regressions:
    cmd: Rscript -e "rmarkdown::render('pipeline/06-regressions.Rmd', 'html_document',
      '../reports/notebooks/06-regressions.html')"
    deps:
    - src/load/
    - r/load.R
    - data/yt_metadata/
    - pipeline/06-regressions.Rmd
    outs:
    - reports/notebooks/06-regressions.html
    - reports/figures/reg_ame_views_elite.svg
    - reports/figures/reg_ame_views_pplcentr.svg
    - reports/figures/reg_ame_likes_elite.svg
    - reports/figures/reg_ame_likes_pplcentr.svg
  top_videos:
    cmd: papermill pipeline/07-top_videos.ipynb reports/notebooks/07-top_videos.ipynb
    deps:
    - src/load/
    - data/yt_metadata/
    - pipeline/07-top_videos.ipynb
    outs:
    - reports/notebooks/07-top_videos.ipynb
    - reports/tables/most_liked_videos_per_channel.csv
    - reports/tables/most_viewed_videos_per_channel.csv
    - reports/tables/most_antielitism_videos_per_channel.csv
