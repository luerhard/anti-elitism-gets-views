name: ytpop
channels:
  - pytorch
  - conda-forge
  - nvidia
  - defaults
platforms:
  - osx
  - linux
dependencies:
  # System
  - libjpeg-turbo>=3.*.*
  # R
  - r-base=4.4.*
  # Housekeeping
  - r-languageserver
  - r-renv
  - r-markdown
  - r-knitr
  - r-svglite
  - r-nloptr
  # functional R
  - r-iml
  - r-reticulate
  - r-ranger
  - r-mlmetrics
  - r-ggeffects
  - r-ggpubr
  - r-sjplot
  - r-tidyverse
  - r-mass=7.3*
  # Python
  - python>=3.11.*
  # Housekeeping
  - papermill
  - ipykernel
  - pip
  - pip:
    - rpy2
    - -e .
  # functional Python
  - ibis-framework=9.5.*
  - matplotlib
  - numpy=2.*.*
  - pandas
  - pytorch::pytorch=2.5.*
  - sqlalchemy
  - transformers
  - torchaudio
  - yt-dlp
  - selector: linux
    run:
      - nvidia::pytorch-cuda
