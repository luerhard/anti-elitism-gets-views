stages:
  build_metadata:
    cmd: papermill pipeline/01-build_metadata.ipynb reports/notebooks/01-build_metadata.ipynb
    deps:
    - data/raw/yt/@AfDFraktionimBundestag
    - data/raw/yt/@AfDTV
    - data/raw/yt/@cducsu
    - data/raw/yt/@cdutv
    - data/raw/yt/@csuimbundestag9622
    - data/raw/yt/@csumedia
    - data/raw/yt/@DieGruenen
    - data/raw/yt/@gruenebundestag
    - data/raw/yt/@DIELINKE
    - data/raw/yt/@dielinkebt
    - data/raw/yt/@linksfraktion
    - data/raw/yt/@FDP
    - data/raw/yt/@fdpbt
    - data/raw/yt/@spdde
    - data/raw/yt/@spdbt
    - pipeline/01-build_metadata.ipynb
    outs:
    - data/yt_metadata/channels.parquet
    - data/yt_metadata/videos.parquet
    - reports/notebooks/01-build_metadata.ipynb

  run_asr:
    cmd: python pipeline/02-run_asr.py
    deps:
    - pipeline/02-run_asr.py
    - src/processing/whisper_pipeline.py
    - data/yt_metadata/videos.parquet
    outs:
    - data/interim/transcripts/v3_large_turbo.parquet:
        persist: true

  tokenize_transcripts:
    cmd: python pipeline/03-tokenize_transcripts.py
    deps:
    - pipeline/03-tokenize_transcripts.py
    - src/processing/transcript_cleaner.py
    - data/interim/transcripts/v3_large_turbo.parquet
    outs:
    - data/yt_metadata/sentences.parquet:
        persist: true
    - data/yt_metadata/broken_transcripts.parquet:
        persist: true

  run_popbert:
    cmd: python pipeline/04-run_popbert.py
    deps:
    - pipeline/04-run_popbert.py
    - src/processing/popbert_predictor.py
    - data/yt_metadata/sentences.parquet
    outs:
    - data/yt_metadata/popbert.parquet:
        persist: true

  basic_descriptives:
    cmd: |
      papermill pipeline/05-basic_descriptives.ipynb reports/notebooks/05-basic_descriptives.ipynb
      cp -fL reports/figures/* overleaf/figures/
      cp -fL reports/tables/* overleaf/tables/
    deps:
    - src/load/load.py
    - data/yt_metadata/
    - pipeline/05-basic_descriptives.ipynb
    outs:
    - reports/notebooks/05-basic_descriptives.ipynb
    - reports/tables/channel_descriptives.csv
    - reports/tables/video_descriptives_per_channel.csv
    - reports/tables/videos_per_channel.csv
    - reports/tables/channel_summary.csv
    - reports/figures/view_count.jpg
    - reports/figures/populism_per_party.jpg
    - reports/figures/populism_over_time.jpg
    - reports/manuscript/inlines/n_broken.txt
    - reports/manuscript/inlines/n_sents.txt
    - reports/manuscript/inlines/n_videos.txt
    - reports/manuscript/inlines/sum_duration.txt

  run_regressions:
    cmd: Rscript pipeline/06-run_regressions.R
    deps:
    - data/yt_metadata/
    - src/load/load.py
    - pipeline/06-run_regressions.R
    outs:
    - data/models/likes_elite
    - data/models/likes_pplcentr
    - data/models/views_elite
    - data/models/views_pplcentr

  export_regression_results:
    cmd: Rscript pipeline/07-export_regression_results.R
    deps:
    - data/models/likes_elite
    - data/models/likes_pplcentr
    - data/models/views_elite
    - data/models/views_pplcentr
    - pipeline/07-export_regression_results.R
    outs:
    - data/interim/regression_results.rds

  plot_regressions:
    cmd: |
      papermill pipeline/08-plot_regressions.ipynb reports/notebooks/08-plot_regressions.ipynb
      cp -fL reports/figures/* overleaf/figures/
    deps:
    - data/interim/regression_results.rds
    - pipeline/08-plot_regressions.ipynb
    outs:
    - reports/figures/reg_views_elite.jpg
    - reports/figures/reg_views_pplcentr.jpg
    - reports/figures/reg_views.jpg
    - reports/figures/reg_likes_elite.jpg
    - reports/figures/reg_likes_pplcentr.jpg
    - reports/notebooks/08-plot_regressions.ipynb

  run_hurdle_models:
    cmd: Rscript pipeline/09-run_hurdle_models.R
    deps:
    - data/yt_metadata/
    - src/load/load.py
    - pipeline/09-run_hurdle_models.R
    outs:
    - data/models/hurdle/

  plot_hurdle_models:
    cmd: |
      papermill pipeline/10-plot_hurdle_models.ipynb reports/notebooks/10-plot_hurdle_models.ipynb
      cp -fL reports/figures/* overleaf/figures/
    deps:
    - data/models/hurdle
    - pipeline/10-plot_hurdle_models.ipynb
    outs:
    - reports/figures/hurdle_model_coefficients.jpg
    - reports/notebooks/10-plot_hurdle_models.ipynb

  top_videos:
    cmd: |
      papermill pipeline/11-top_videos.ipynb reports/notebooks/11-top_videos.ipynb
      cp -fL reports/tables/* overleaf/tables/
    deps:
    - src/load/load.py
    - data/yt_metadata/
    - pipeline/11-top_videos.ipynb
    outs:
    - reports/notebooks/11-top_videos.ipynb
    - reports/tables/most_liked_videos_per_channel.csv
    - reports/tables/most_viewed_videos_per_channel.csv
    - reports/tables/most_antielitism_videos_per_channel.csv

  bayes_r2_simulation:
    cmd: |
      papermill pipeline/12-bayes_r2_synthetic_test.ipynb reports/notebooks/12-bayes_r2_synthetic_test.ipynb
      cp -fL reports/figures/* overleaf/figures/
      cp -fL reports/tables/* overleaf/tables/
    deps:
    - pipeline/12-bayes_r2_synthetic_test.ipynb
    outs:
    - reports/notebooks/12-bayes_r2_synthetic_test.ipynb
    - reports/figures/bayes_r2_synthetic.jpg
    - reports/figures/bayes_r2_synthetic_coefficients.jpg
    - reports/tables/synthetic_correlation_matrix.csv

  validate_whisper:
    cmd: marimo export html pipeline/13-whisper_wer.py -o reports/notebooks/13-whisper_wer.html
    deps:
    - data/validation/whisper/
    - pipeline/13-whisper_wer.py
    outs:
    - reports/notebooks/13-whisper_wer.html

  validate_popbert:
    cmd: marimo export html pipeline/14-validate_popbert.py -o reports/notebooks/14-validate_popbert.html
    deps:
    - data/validation/popbert/
    - pipeline/14-validate_popbert.py
    outs:
    - reports/notebooks/14-validate_popbert.html
