[project]
description = "Add your description here"
name = "ytpop"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"
dependencies = [
    "emoji>=2.14.1",
    "ibis-framework[duckdb]>=10.5.0",
    "ipython==8.31.0",
    "levenshtein>=0.27.1",
    "librosa>=0.11.0",
    "matplotlib>=3.10.3",
    "multiprocessing-logging>=0.3.4",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "rpy2>=3.5.17",
    "silero-vad>=5.1.2",
    "somajo>=2.4.3",
    "torch>=2.7.0",
    "torchaudio>=2.7.0",
    "torchvision>=0.22.0",
    "tqdm>=4.67.1",
    "transformers>=4.51.3",
    "werpy>=3.1.0",
    "yt-dlp>=2025.4.30",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29.5",
  "jupyter>=1.1.1",
  "marimo[recommended]>=0.17.8",
  "papermill>=2.6.0",
  "pip>=25.1.1",
  "pytest>=8.3.5",
  "pytest-cases>=3.8.6",
  "python-lsp-ruff>=2.3.0",
  "python-lsp-server>=1.13.2",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-local-folder = ["src"]

[tool.ruff.lint]
ignore = ["D107", "E712", "F401", "COM812"]
select = [
  "ARG", # flake8-unused-arguments
  "B", # flake8-bugbear
  "C4", #flake8-comprehensions
  "COM", #flake8-commas
  "E", # pycodestyle
  "EM", # flake8-errmsg
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "PT", #flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "Q", # flake8-quotes
  "UP", # pyupgrade
]


[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
include = ["src"]
