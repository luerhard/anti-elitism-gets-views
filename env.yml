name: ytpop
channels:
  - conda-forge
  - pytorch
  - nvidia
platforms:
  - osx
  - linux
dependencies:
  - python=3.11
  - pandas
  - numpy>=2.0
  - r-base
  - r-renv
  - r-reticulate
  - r-ggeffects
  - r-sjplot
  - r-tidyverse
  - r-mass
  - transformers
  - pytorch::pytorch>=2.5
  - torchaudio
  - selector: linux
    run:
      - nvidia::pytorch-cuda

