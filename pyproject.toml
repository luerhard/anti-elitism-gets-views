[tool.poetry]
name = "populism-on-yt"
version = "0.1.0"
description = ""
authors = ["Lukas Erhard <luerhard@googlemail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
ipykernel = "^6.25.1"
numpy = ">=1.26.2"
pandas = ">=2.0.3"
sqlalchemy = "^2.0.19"
pytest = "^7.4.0"
transformers = "^4.31.0"
ipywidgets = "^8.1.0"
yt-dlp = "^2023.7.6"
levenshtein-distance = "^1.0.1"
pytest-cases = "^3.6.14"
torch = "^2.1.2"
torchvision = "^0.16.2"
torchaudio = "^2.1.2"
multiprocessing-logging = "^0.3.4"
alembic = "^1.13.1"
psycopg = {extras = ["binary", "pool"], version = "^3.1.17"}
seaborn = "^0.13.2"
plotnine = "^0.12.4"
somajo = "^2.4.0"
pyarrow = "^15.0.0"
rpy2 = "^3.5.15"
scikit-learn = "^1.4.0"

[tool.pytest.ini_options]
markers = [
  "slow: marks a test as slow",
  "online: marks tests as needing a internet-connection",
]
pythonpath = [
  "."
]

[tool.ruff]
fix = true
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
select = [
"ARG", # flake8-unused-arguments
"B", # flake8-bugbear
"C4", #flake8-comprehensions
"COM", #flake8-commas
"E", # pycodestyle
"EM", # flake8-errmsg
"F", # pyflakes
"I", # isort
"N", # pep8-naming
"PT", #flake8-pytest-style
"PTH", # flake8-use-pathlib
"Q", # flake8-quotes
"UP", # pyupgrade
]
ignore = ["D107"]
target-version = "py311"
line-length = 100
ignore-init-module-imports = true

[tool.ruff.per-file-ignores]
"__init__.py" = ["E402"]
"docs/**" = ["D"]
"tests/**" = ["D"]
"notebooks/**" = ["D"]
"pipeline/**" = ["D103"]
"notebooks/01-playground/**" = ["D103", "E402", "E501"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.isort]
force-single-line = true
force-sort-within-sections = true
lines-after-imports = 1
known-local-folder = ["src"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
